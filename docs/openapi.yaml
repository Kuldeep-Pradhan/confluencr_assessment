openapi: 3.1.0
info:
  title: Transaction Ledger API
  version: 1.0.0
  description: |
    Five business endpoints (four mandatory, one bonus). All monetary values are decimal
    strings; arithmetic is exact. Only JSON request bodies are accepted (10kb maximum).
    Accounts start at zero. Ledger records cannot be changed or deleted.
    Duplicate account-scoped transaction references are rejected, not replayed as success.
    Transfer references are globally unique, with derived account-scoped -out/-in entries.
    Unknown request body fields and unknown history query parameters are rejected.
    UUID parameters must be UUIDv4; case is normalized. No authentication is implemented,
    as specified in the plan. Do not expose this assessment service publicly without access controls.
    Rate limiting applies to /api/v1 (default 100 requests per minute per IP).
servers:
  - url: /
    description: Current service (default http://localhost:3000)
tags:
  - name: Accounts
  - name: Transactions
  - name: Transfers
  - name: Operations
paths:
  /api/v1/accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create a zero-balance account
      description: The database generates the UUID and timestamp. Supplying balance, id, created_at, or any extra field returns 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
            example: { name: Jane Doe }
      responses:
        '201':
          description: Account created with a zero balance
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
              example:
                success: true
                data:
                  id: a98c8f8e-42c2-47e1-889b-82f534891bca
                  name: Jane Doe
                  balance: '0.00'
                  created_at: '2026-10-28T09:00:00.000Z'
        '400': { $ref: '#/components/responses/ValidationError' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/accounts/{accountId}/balance:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      tags: [Accounts]
      operationId: getBalance
      summary: Get the current committed account balance
      responses:
        '200':
          description: Existing account's real-time balance
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceResponse' }
              example:
                success: true
                data:
                  account_id: a98c8f8e-42c2-47e1-889b-82f534891bca
                  name: Jane Doe
                  balance: '100.50'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/accounts/{accountId}/transactions:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    post:
      tags: [Transactions]
      operationId: addTransaction
      summary: Atomically credit or debit an account
      description: |
        Locks the account, checks reference uniqueness and funds, updates the balance,
        and inserts one immutable ledger record in a single database transaction.
        Any failure rolls back all changes. Duplicate reference checks precede funds checks,
        so a retry of a successful debit returns 409 even if the source is now empty.
        The same reference is permitted on another account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRequest' }
            examples:
              credit:
                value: { type: credit, amount: '100.50', description: 'Invoice payment #1042', reference_id: REF-992144 }
              debit:
                value: { type: debit, amount: '30.25', reference_id: REF-992145 }
      responses:
        '201':
          description: Ledger entry and balance update committed atomically
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
              example:
                success: true
                data:
                  id: e4b2d398-3482-411a-9418-2e38c92819ab
                  account_id: a98c8f8e-42c2-47e1-889b-82f534891bca
                  type: credit
                  amount: '100.50'
                  description: 'Invoice payment #1042'
                  reference_id: REF-992144
                  current_balance: '100.50'
                  created_at: '2026-10-28T09:01:00.000Z'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409': { $ref: '#/components/responses/DuplicateTransaction' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableOperation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Transactions]
      operationId: getHistory
      summary: Retrieve filtered, paginated, latest-first ledger entries
      description: |
        Account existence, count and page share a repeatable-read snapshot. Sort order is
        created_at DESC, id DESC (UUID tie-breaker). Omitted or empty type returns both types.
        Out-of-range pages return an empty array with accurate counts. An empty ledger has
        total_records=0 and total_pages=0. Query parameters must not be repeated.
      parameters:
        - name: type
          in: query
          required: false
          description: Omit or pass an empty string to include credit and debit.
          schema: { type: string, enum: [credit, debit, ''] }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 2147483647, default: 1 }
          description: Positive decimal integer, no fractional/exponential/negative values.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Ledger page and matching-filter pagination metadata
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryResponse' }
              examples:
                populated:
                  value:
                    success: true
                    data:
                      transactions:
                        - id: e4b2d398-3482-411a-9418-2e38c92819ab
                          account_id: a98c8f8e-42c2-47e1-889b-82f534891bca
                          type: credit
                          amount: '100.50'
                          description: 'Invoice payment #1042'
                          reference_id: REF-992144
                          created_at: '2026-10-28T09:01:00.000Z'
                      pagination: { current_page: 1, page_size: 10, total_records: 1, total_pages: 1 }
                outOfRange:
                  value:
                    success: true
                    data:
                      transactions: []
                      pagination: { current_page: 999, page_size: 10, total_records: 1, total_pages: 1 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/transfers:
    post:
      tags: [Transfers]
      operationId: transferMoney
      summary: Atomically transfer funds between two accounts (bonus)
      description: |
        Locks both accounts in normalized UUID order to avoid AB-BA deadlocks. Both accounts
        must exist and be different. Commits source debit, destination credit, two ledger
        entries and an audit record together, or rolls everything back. Transfer reference_id
        is globally unique. Ledger entries use reference_id-out and reference_id-in; an existing
        normal transaction using a derived reference returns DUPLICATE_TRANSACTION.
        A duplicate audit reference returns DUPLICATE_TRANSFER. Transfer-specific limits
        (96 reference characters, 440 description characters) preserve ledger column limits
        after suffixes and account-identifying description prefixes are added.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
            example:
              source_account_id: a98c8f8e-42c2-47e1-889b-82f534891bca
              destination_account_id: b12d8a11-55f1-4322-a89c-334199aa1123
              amount: '50.00'
              description: Vendor settlement
              reference_id: TRF-00129
      responses:
        '201':
          description: Both balances, both ledger entries and audit record committed
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }
              example:
                success: true
                data:
                  id: c987f04b-0c72-45f2-9ec2-ff2c9d005042
                  source_account_id: a98c8f8e-42c2-47e1-889b-82f534891bca
                  destination_account_id: b12d8a11-55f1-4322-a89c-334199aa1123
                  amount: '50.00'
                  source_transaction_id: e4b2d398-3482-411a-9418-2e38c92819ab
                  destination_transaction_id: f241d8ce-00ef-4e02-b1ca-02dca45fb53f
                  reference_id: TRF-00129
                  created_at: '2026-10-28T09:02:00.000Z'
                  source_balance: '50.50'
                  destination_balance: '50.00'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409':
          description: Global transfer reference or derived account-scoped ledger reference already exists. No changes persisted.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                duplicateTransfer:
                  value: { success: false, error: { code: DUPLICATE_TRANSFER, message: Transfer with this reference_id already exists, details: [] } }
                ledgerCollision:
                  value: { success: false, error: { code: DUPLICATE_TRANSACTION, message: Transaction with this reference_id already exists for this account, details: [] } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableOperation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /health:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Process liveness (does not require PostgreSQL)
      responses:
        '200':
          description: HTTP process is running; does not assert database connectivity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
              example:
                success: true
                data: { status: UP, uptime: 12.5, timestamp: '2026-10-28T09:00:00.000Z', environment: development }
        '500': { $ref: '#/components/responses/InternalError' }
  /health/ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Verify a live PostgreSQL query
      responses:
        '200':
          description: Database connection and SELECT 1 succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
              example: { success: true, data: { status: UP, database: UP } }
        '503':
          description: PostgreSQL connection or query failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: { code: SERVICE_UNAVAILABLE, message: Database is unavailable, details: [] } }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1:
    get:
      tags: [Operations]
      operationId: getApiInfo
      summary: Service metadata and documentation location
      responses:
        '200':
          description: API metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiInfoResponse' }
              example: { success: true, data: { message: Transaction Ledger API v1 ready, documentation: /api/v1/docs } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/openapi.yaml:
    get:
      tags: [Operations]
      operationId: downloadOpenApi
      summary: Download this Swagger/OpenAPI specification
      responses:
        '200':
          description: The complete OpenAPI YAML document
          content:
            application/yaml:
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/docs/:
    get:
      tags: [Operations]
      operationId: getSwaggerUi
      summary: Interactive Swagger UI
      description: /api/v1/docs redirects to /api/v1/docs/.
      responses:
        '200':
          description: HTML Swagger UI; static asset requests use this path prefix
          content:
            text/html:
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  headers:
    RequestId:
      description: Correlation ID shared by response headers and structured request logs. Optionally supplied through X-Request-Id (1-100 alphanumeric, underscore or hyphen characters).
      schema: { type: string }
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: Existing account UUIDv4; malformed identifiers return 400, missing accounts return 404.
      schema: { $ref: '#/components/schemas/Uuid' }
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    MoneyInput:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^(?=.*[1-9])0*\d{1,12}(\.\d{1,2})?$'
      description: Positive decimal string from 0.01 to 999999999999.99 inclusive; no sign, whitespace, exponent or more than two decimal places. Integers and one-decimal strings are normalized. Numeric JSON values are rejected. The numerical range is enforced by exact BigInt validation.
      examples: ['0.01', '50', '100.50']
    Money:
      type: string
      pattern: '^(0|[1-9]\d{0,12})\.\d{2}$'
      description: Exact non-negative monetary value with two decimal places. Balance maximum is 9999999999999.99 (NUMERIC(15,2)).
      examples: ['0.00', '100.50']
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255, description: Trimmed non-empty account holder name. Whitespace-only values are rejected. }
    TransactionRequest:
      type: object
      additionalProperties: false
      required: [type, amount, reference_id]
      properties:
        type: { type: string, enum: [credit, debit] }
        amount: { $ref: '#/components/schemas/MoneyInput' }
        description: { type: string, maxLength: 500, default: '', description: Optional trimmed description. }
        reference_id: { type: string, minLength: 1, maxLength: 100, description: Trimmed non-empty idempotency key unique within this account; case-sensitive. }
    TransferRequest:
      type: object
      additionalProperties: false
      required: [source_account_id, destination_account_id, amount, reference_id]
      properties:
        source_account_id: { $ref: '#/components/schemas/Uuid' }
        destination_account_id: { $ref: '#/components/schemas/Uuid' }
        amount: { $ref: '#/components/schemas/MoneyInput' }
        reference_id: { type: string, minLength: 1, maxLength: 96, description: Trimmed non-empty globally unique transfer reference; suffix space is reserved for derived ledger references. }
        description: { type: string, maxLength: 440, default: '', description: Trimmed description; space is reserved for the ledger account-identifying prefix. }
    Account:
      type: object
      additionalProperties: false
      required: [id, name, balance, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 255 }
        balance: { $ref: '#/components/schemas/Money' }
        created_at: { type: string, format: date-time }
    AccountResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Account' }
    BalanceResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          additionalProperties: false
          required: [account_id, name, balance]
          properties:
            account_id: { $ref: '#/components/schemas/Uuid' }
            name: { type: string, minLength: 1, maxLength: 255 }
            balance: { $ref: '#/components/schemas/Money' }
    Transaction:
      type: object
      additionalProperties: false
      required: [id, account_id, type, amount, description, reference_id, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        account_id: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [credit, debit] }
        amount: { $ref: '#/components/schemas/Money' }
        description: { type: string, maxLength: 500 }
        reference_id: { type: string, minLength: 1, maxLength: 100 }
        created_at: { type: string, format: date-time }
    TransactionResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          additionalProperties: false
          required: [id, account_id, type, amount, description, reference_id, current_balance, created_at]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            account_id: { $ref: '#/components/schemas/Uuid' }
            type: { type: string, enum: [credit, debit] }
            amount: { $ref: '#/components/schemas/Money' }
            description: { type: string, maxLength: 500 }
            reference_id: { type: string, minLength: 1, maxLength: 100 }
            current_balance: { $ref: '#/components/schemas/Money' }
            created_at: { type: string, format: date-time }
    Pagination:
      type: object
      additionalProperties: false
      required: [current_page, page_size, total_records, total_pages]
      properties:
        current_page: { type: integer, minimum: 1, maximum: 2147483647 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total_records: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
    HistoryResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          additionalProperties: false
          required: [transactions, pagination]
          properties:
            transactions: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
            pagination: { $ref: '#/components/schemas/Pagination' }
    TransferResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          additionalProperties: false
          required: [id, source_account_id, destination_account_id, amount, source_transaction_id, destination_transaction_id, reference_id, created_at, source_balance, destination_balance]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            source_account_id: { $ref: '#/components/schemas/Uuid' }
            destination_account_id: { $ref: '#/components/schemas/Uuid' }
            amount: { $ref: '#/components/schemas/Money' }
            source_transaction_id: { $ref: '#/components/schemas/Uuid' }
            destination_transaction_id: { $ref: '#/components/schemas/Uuid' }
            reference_id: { type: string, minLength: 1, maxLength: 96 }
            created_at: { type: string, format: date-time }
            source_balance: { $ref: '#/components/schemas/Money' }
            destination_balance: { $ref: '#/components/schemas/Money' }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          additionalProperties: false
          required: [status, uptime, timestamp, environment]
          properties:
            status: { type: string, const: UP }
            uptime: { type: number, minimum: 0 }
            timestamp: { type: string, format: date-time }
            environment: { type: string, enum: [development, test, production] }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          additionalProperties: false
          required: [status, database]
          properties:
            status: { type: string, const: UP }
            database: { type: string, const: UP }
    ApiInfoResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          additionalProperties: false
          required: [message, documentation]
          properties:
            message: { type: string }
            documentation: { type: string, const: /api/v1/docs }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, ACCOUNT_NOT_FOUND, NOT_FOUND, DUPLICATE_TRANSACTION, DUPLICATE_TRANSFER, INSUFFICIENT_FUNDS, BALANCE_LIMIT_EXCEEDED, DATABASE_ERROR, INTERNAL_SERVER_ERROR, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, RATE_LIMIT_EXCEEDED, SERVICE_UNAVAILABLE]
            message: { type: string }
            details:
              type: array
              description: Validation issue objects; an empty array for domain, database and infrastructure errors. Stack traces and credentials are never returned.
              items:
                type: object
                additionalProperties: false
                required: [path, message]
                properties:
                  path: { type: string }
                  message: { type: string }
  responses:
    ValidationError:
      description: Invalid body, malformed JSON, missing required fields, malformed UUID, invalid amount/type, or invalid pagination. No changes persisted.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            invalidField:
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Invalid request payload or parameters
                  details: [{ path: body.amount, message: Amount must be between 0.01 and 999999999999.99 }]
            malformedJson:
              value: { success: false, error: { code: VALIDATION_ERROR, message: Malformed JSON in request body, details: [] } }
    AccountNotFound:
      description: Account does not exist (for transfers, source or destination is missing).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: ACCOUNT_NOT_FOUND, message: Account not found, details: [] } }
    DuplicateTransaction:
      description: This account already has the supplied reference_id; ledger and balance unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: DUPLICATE_TRANSACTION, message: Transaction with this reference_id already exists for this account, details: [] } }
    UnprocessableOperation:
      description: Debit exceeds balance, or resulting credit/destination balance would exceed NUMERIC(15,2). No changes persisted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            insufficientFunds:
              value: { success: false, error: { code: INSUFFICIENT_FUNDS, message: Account has insufficient balance for this operation, details: [] } }
            balanceOverflow:
              value: { success: false, error: { code: BALANCE_LIMIT_EXCEEDED, message: Resulting balance exceeds the supported database balance limit, details: [] } }
    PayloadTooLarge:
      description: JSON body exceeds 10kb; no changes persisted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: PAYLOAD_TOO_LARGE, message: Request body exceeds the 10kb limit, details: [] } }
    UnsupportedMediaType:
      description: POST request is not application/json, or body charset/encoding is unsupported.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: UNSUPPORTED_MEDIA_TYPE, message: Request body must use application/json, details: [] } }
    RateLimited:
      description: Per-IP request limit exceeded. Wait for the next window; rejected request has not reached business logic.
      headers:
        Retry-After: { description: Seconds until another attempt is allowed, schema: { type: integer } }
        RateLimit: { description: Draft-8 rate limit information, schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: RATE_LIMIT_EXCEEDED, message: Too many requests; retry after the rate limit window, details: [] } }
    InternalError:
      description: Database or unexpected server error; internal details are logged, not exposed. Database transactions roll back on failure before commit. For network/commit acknowledgement loss, check history by reference before retrying; an already committed reference is rejected with 409.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            databaseError:
              value: { success: false, error: { code: DATABASE_ERROR, message: A database operation failed, details: [] } }
            unexpectedError:
              value: { success: false, error: { code: INTERNAL_SERVER_ERROR, message: An internal server error occurred, details: [] } }
